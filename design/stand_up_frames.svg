<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 300" width="960" height="300">
  <!-- Stand up: 4 key poses from bun_pet.svg using squash & stretch (pivot = between the feet, 100,192).
       1 sit (scale 1.10 x 0.80) · 2 crouch/push up (1.05 x 0.90) · 3 stand (1 x 1) · 4 reach up (0.96 x 1.06, arms up, happy eyes).
       In Compose: animate scaleX/scaleY with a spring between poses; swap arm + eye layers per pose. -->
  <defs>
    <g id="body">
      <path d="M100 46 C130 46 144 62 149 86 C153 106 166 124 166 148 C166 174 140 190 100 190 C60 190 34 174 34 148 C34 124 47 106 51 86 C56 62 70 46 100 46 Z" fill="#F5DC8B"/>
      <circle cx="62" cy="54" r="18" fill="#F5DC8B"/>
      <circle cx="138" cy="54" r="18" fill="#F5DC8B"/>
      <circle cx="62" cy="55" r="9" fill="#F6A98A"/>
      <circle cx="138" cy="55" r="9" fill="#F6A98A"/>
      <ellipse cx="72" cy="118" rx="9" ry="5.5" fill="#F7A58B"/>
      <ellipse cx="128" cy="118" rx="9" ry="5.5" fill="#F7A58B"/>
      <path d="M96 112 Q100 117 104 112 Z" fill="#2B2A3A" stroke="#2B2A3A" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g id="eyesOpen" fill="#2B2A3A">
      <circle cx="84" cy="106" r="5.5"/>
      <circle cx="116" cy="106" r="5.5"/>
    </g>
    <g id="eyesHappy" fill="none" stroke="#2B2A3A" stroke-width="3.6" stroke-linecap="round">
      <path d="M78 108 Q84 100 90 108"/>
      <path d="M110 108 Q116 100 122 108"/>
    </g>
    <g id="armsSide" fill="#F5DC8B">
      <ellipse cx="36" cy="132" rx="10" ry="17" transform="rotate(28 36 132)"/>
      <ellipse cx="164" cy="132" rx="10" ry="17" transform="rotate(-28 164 132)"/>
    </g>
    <g id="armsLap" fill="#F5DC8B">
      <ellipse cx="52" cy="150" rx="10" ry="16" transform="rotate(50 52 150)"/>
      <ellipse cx="148" cy="150" rx="10" ry="16" transform="rotate(-50 148 150)"/>
    </g>
    <g id="armsUp" fill="#F5DC8B">
      <ellipse cx="42" cy="72" rx="10" ry="20" transform="rotate(-18 42 72)"/>
      <ellipse cx="158" cy="72" rx="10" ry="20" transform="rotate(18 158 72)"/>
    </g>
  </defs>
  <rect width="960" height="300" fill="#EAF3FD"/>

  <!-- 1 Sit: feet forward, squashed body -->
  <g transform="translate(20 50)">
    <ellipse cx="74" cy="194" rx="15" ry="9" fill="#F5DC8B"/>
    <ellipse cx="126" cy="194" rx="15" ry="9" fill="#F5DC8B"/>
    <g transform="translate(100 192) scale(1.10 0.80) translate(-100 -192)">
      <use xlink:href="#body"/><use xlink:href="#eyesOpen"/><use xlink:href="#armsLap"/>
    </g>
  </g>

  <!-- 2 Crouch / push up -->
  <g transform="translate(260 50)">
    <ellipse cx="78" cy="192" rx="13" ry="10" fill="#F5DC8B"/>
    <ellipse cx="122" cy="192" rx="13" ry="10" fill="#F5DC8B"/>
    <g transform="translate(100 192) scale(1.05 0.90) translate(-100 -192)">
      <use xlink:href="#armsLap"/><use xlink:href="#body"/><use xlink:href="#eyesOpen"/>
    </g>
  </g>

  <!-- 3 Stand -->
  <g transform="translate(500 50)">
    <ellipse cx="80" cy="192" rx="13" ry="10" fill="#F5DC8B"/>
    <ellipse cx="120" cy="192" rx="13" ry="10" fill="#F5DC8B"/>
    <use xlink:href="#armsSide"/><use xlink:href="#body"/><use xlink:href="#eyesOpen"/>
  </g>

  <!-- 4 Reach up -->
  <g transform="translate(740 50)">
    <ellipse cx="82" cy="192" rx="12" ry="10" fill="#F5DC8B"/>
    <ellipse cx="118" cy="192" rx="12" ry="10" fill="#F5DC8B"/>
    <g transform="translate(100 192) scale(0.96 1.06) translate(-100 -192)">
      <use xlink:href="#armsUp"/><use xlink:href="#body"/><use xlink:href="#eyesHappy"/>
    </g>
  </g>
</svg>
