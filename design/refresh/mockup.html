<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual refresh</title>
<!--
  Visual refresh mockups (not app code). Open through a local web server so the bundled fonts load:
  python design/refresh/render.py   (renders previews/*.png)
  or: python -m http.server 8765  → http://localhost:8765/design/refresh/mockup.html?d=a  (a, b, c, icons)
-->
<style>
@font-face { font-family: Fredoka; font-weight: 600; src: url('../../app/src/main/res/font/fredoka_semibold.ttf'); }
@font-face { font-family: Nunito; font-weight: 600; src: url('../../app/src/main/res/font/nunito_semibold.ttf'); }
@font-face { font-family: Nunito; font-weight: 700; src: url('../../app/src/main/res/font/nunito_bold.ttf'); }
@font-face { font-family: Nunito; font-weight: 800; src: url('../../app/src/main/res/font/nunito_extrabold.ttf'); }

:root { --ink: #2B2A3A; --muted: #56556A; --card: #FFFFFF; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #E9E5DF; font-family: Nunito, sans-serif; color: var(--ink); }

/* ---------- board ---------- */
.board { width: 1380px; padding: 40px 48px 36px; }
.board-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; margin-bottom: 30px; height: 160px; }
.board-head .swatches { align-self: flex-end; }
.tag { font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #6B6A7B; }
.board h1 { font-family: Fredoka; font-weight: 600; font-size: 44px; margin: 2px 0 6px; }
.board .lede { font-weight: 600; font-size: 17px; color: #4F4E62; margin: 0; max-width: 560px; line-height: 1.4; }
.swatches { display: grid; grid-template-columns: repeat(6, 92px); gap: 10px; }
.sw { font-size: 12px; font-weight: 700; color: #4F4E62; line-height: 1.25; }
.sw i { display: block; height: 44px; border-radius: 12px; margin-bottom: 6px; box-shadow: inset 0 0 0 1px rgba(43,42,58,.08); }
.sw b { display: block; font-weight: 800; color: var(--ink); }
.phones { display: flex; gap: 40px; justify-content: center; }
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.phone-label { font-family: Fredoka; font-size: 20px; }
.board-foot { margin-top: 26px; display: flex; gap: 28px; font-size: 14px; font-weight: 700; color: #4F4E62; line-height: 1.45; }
.board-foot div { flex: 1; }
.board-foot b { color: var(--ink); font-weight: 800; }

/* ---------- phone ---------- */
.phone { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative;
  box-shadow: 0 0 0 9px #26252F, 0 28px 50px rgba(30, 28, 40, .22); display: flex; flex-direction: column; }
.screen { flex: 1; position: relative; overflow: hidden; }
.tabbar { height: 84px; background: #FFFFFF; border-top: 2px solid #F3E9DD; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px 14px; flex-shrink: 0; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 12px; color: #6B6A7B; }
.tab span { width: 56px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.tab.on { color: var(--ink); font-weight: 800; }
.tab.on span { background: #FDE6CF; }

/* shared bits */
.chunky { background: var(--card); border-radius: 24px; }
.pill-btn { position: absolute; background: #fff; display: flex; align-items: center; justify-content: center; }
.spark { width: 20px; height: 20px; }
.h-title { font-family: Fredoka; font-weight: 600; font-size: 32px; margin: 0; }
.h-section { font-family: Fredoka; font-weight: 600; font-size: 22px; margin: 0; }

/* home */
.scene { position: absolute; left: 0; top: 0; width: 390px; height: 340px; }
.pet { position: absolute; left: 100px; top: 116px; width: 190px; height: 190px; }
.menu { left: 16px; top: 16px; width: 48px; height: 48px; border-radius: 16px; }
.sparks { right: 16px; top: 20px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; gap: 6px; font-weight: 800; font-size: 16px; }
.timer { position: absolute; left: 16px; right: 16px; top: 304px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.timer small { font-size: 13px; font-weight: 700; color: #6B6A7B; }
.timer .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer .min { font-family: Fredoka; font-weight: 600; font-size: 32px; line-height: 1.1; }
.chip { font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 999px; }
.bar { height: 10px; border-radius: 999px; background: #F1EBE3; overflow: hidden; }
.bar i { display: block; height: 10px; border-radius: 999px; }
.list { position: absolute; left: 0; right: 0; top: 432px; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px 10px; }
.list-head span { font-size: 14px; font-weight: 700; }
.cards { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.brk { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; }
.tile { width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile img { width: 36px; height: 36px; }
.brk .txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.brk .txt b { font-weight: 800; font-size: 17px; }
.brk .txt span { font-weight: 600; font-size: 14px; color: #6B6A7B; }
.reward { display: flex; align-items: center; gap: 3px; font-weight: 800; font-size: 15px; }
.reward svg { width: 16px; height: 16px; }
.check { width: 52px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* collection */
.col-head { padding: 22px 20px 4px; display: flex; justify-content: space-between; align-items: center; }
.col-head .sparks { position: static; }
.col-sub { padding: 0 20px 16px; font-weight: 600; font-size: 15px; margin: 0; }
.seg { margin: 0 16px 14px; border-radius: 999px; padding: 4px; display: grid; grid-template-columns: 1fr 1fr; }
.seg div { text-align: center; padding: 8px; border-radius: 999px; font-weight: 800; font-size: 15px; }
.seg .on { background: #fff; color: var(--ink); }
.grid { padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pcard { padding: 10px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.pcard.active { box-shadow: inset 0 0 0 3px var(--ink) !important; }
.pcard svg { width: 112px; height: 112px; margin-top: 8px; }
.pcard b { font-family: Fredoka; font-weight: 600; font-size: 20px; }
.ppill { font-weight: 800; font-size: 14px; padding: 4px 12px; border-radius: 999px; display: flex; align-items: center; gap: 4px; }
.ppill svg { width: 14px; height: 14px; margin: 0; }

/* settings */
.set { padding: 22px 16px 0; }
.set .h-title { padding: 0 4px 14px; }
.set .h-section { padding: 18px 4px 10px; }
.group { overflow: hidden; }
.srow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 64px; position: relative; }
/* Inset divider: starts where the row text starts (16 + 44 tile + 14 gap). */
.srow + .srow::before, .srow.line::before { content: ''; position: absolute; top: 0; left: 74px; right: 0; height: 1.5px; background: #F1EBE3; }
.full-line { border-top: 1.5px solid #F1EBE3; }
.srow .stile { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.srow .stile img { width: 30px; height: 30px; }
.srow .st { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.srow .st b { font-weight: 800; font-size: 17px; }
.srow .st span { font-weight: 600; font-size: 14px; color: #6B6A7B; line-height: 1.3; }
.status { font-size: 14px; font-weight: 800; padding: 4px 12px; border-radius: 999px; }
.value { font-family: Fredoka; font-weight: 600; font-size: 22px; }
.days { display: flex; justify-content: space-between; padding: 14px 16px; }
.day { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
.toggle { width: 52px; height: 32px; border-radius: 999px; background: #3BAA6E; position: relative; flex-shrink: 0; }
.toggle::after { content: ''; position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
.hint { padding: 12px 16px 2px 16px; font-size: 14px; font-weight: 600; }

/* icon sheet */
.icons-board { width: 1260px; padding: 40px 48px; }
.icon-row { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 22px; }
.icon-cell { width: 140px; background: #fff; border-radius: 24px; padding: 16px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 4px 0 #DDD5CA; font-weight: 800; font-size: 14px; text-align: center; }
.icon-cell .big { width: 96px; height: 96px; border-radius: 28px; display: flex; align-items: center; justify-content: center; }
.icon-cell .big img { width: 72px; height: 72px; }
.icon-cell .small { display: flex; gap: 8px; align-items: center; }
.icon-cell .small .tile img { width: 36px; height: 36px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- shared art ----------
const INK = '#2B2A3A';
const SPARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z" fill="#FFC857" stroke="#E5A52A" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const CHECK = c => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>`;
const MENU = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`;

// Pet layers, from design/bun_pet.svg and design/pets/*/<name>_pet.svg (viewBox 0 0 200 210).
const FEET = '<ellipse cx="80" cy="192" rx="13" ry="10"/><ellipse cx="120" cy="192" rx="13" ry="10"/>';
const ARMS = '<ellipse cx="36" cy="132" rx="10" ry="17" transform="rotate(28 36 132)"/><ellipse cx="164" cy="132" rx="10" ry="17" transform="rotate(-28 164 132)"/>';
const PET = {
  bun: { body: '#F5DC8B', edge: '#EBCB6A', arms: ARMS,
    sil: '<path d="M100 46 C130 46 144 62 149 86 C153 106 166 124 166 148 C166 174 140 190 100 190 C60 190 34 174 34 148 C34 124 47 106 51 86 C56 62 70 46 100 46 Z"/><circle cx="62" cy="54" r="18"/><circle cx="138" cy="54" r="18"/>' },
  pip: { arms: '<ellipse cx="37" cy="134" rx="9" ry="19" transform="rotate(38 37 134)"/><ellipse cx="163" cy="134" rx="9" ry="19" transform="rotate(-38 163 134)"/>',
    sil: '<path d="M100 54 C123 54 137 72 145 94 C155 117 166 133 166 153 C166 178 140 190 100 190 C60 190 34 178 34 153 C34 133 45 117 55 94 C63 72 77 54 100 54 Z"/><ellipse cx="100" cy="47" rx="7.5" ry="11"/><ellipse cx="88" cy="52" rx="6.5" ry="10" transform="rotate(-32 88 52)"/><ellipse cx="112" cy="52" rx="6.5" ry="10" transform="rotate(32 112 52)"/>' },
  toast: { arms: ARMS, crust: true,
    sil: '<path d="M42 104 L42 174 Q42 188 56 188 L144 188 Q158 188 158 174 L158 104 C176 98 182 78 170 60 C158 44 132 38 100 38 C68 38 42 44 30 60 C18 78 24 98 42 104 Z"/>' },
  nimbus: { arms: ARMS,
    sil: '<path d="M38 142 C38 110 62 98 100 98 C138 98 162 110 162 142 C162 176 140 190 100 190 C60 190 38 176 38 142 Z"/><circle cx="63" cy="104" r="26"/><circle cx="100" cy="74" r="38"/><circle cx="137" cy="104" r="26"/>' },
};
let uid = 0;

/** Bun as PetView draws it: grey silhouette, colour clipped from fillTop (CLAUDE.md §7). */
function bun(energy, mood) {
  const p = PET.bun, id = 'c' + (uid++);
  const fillTop = 36 + (1 - energy) * 160;
  const grey = '#E9E5DE';
  const arms = fillTop < 128 ? p.body : grey, feet = fillTop < 185 ? p.body : grey;
  const tired = mood === 'tired';
  const eyes = tired
    ? `<g fill="none" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"><path d="M78 106 L90 106"/><path d="M110 106 L122 106"/></g>`
    : `<g fill="${INK}"><circle cx="84" cy="106" r="5.5"/><circle cx="116" cy="106" r="5.5"/></g>`;
  const mouth = tired
    ? `<path d="M96 114 L104 114" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`
    : `<path d="M96 112 Q100 117 104 112 Z" fill="${INK}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 200 210" preserveAspectRatio="xMidYMax meet"><defs><clipPath id="${id}">${p.sil}</clipPath></defs>
    <g fill="${feet}">${FEET}</g>
    <g transform="rotate(${tired ? 2 : 0} 100 192)">
      <g fill="${arms}">${p.arms}</g>
      <g clip-path="url(#${id})"><rect width="200" height="210" fill="${grey}"/><rect y="${fillTop}" width="200" height="210" fill="${p.body}"/>${energy < 1 ? `<rect y="${fillTop}" width="200" height="4" fill="${p.edge}"/>` : ''}</g>
      <g fill="#F6A98A"><circle cx="62" cy="55" r="9"/><circle cx="138" cy="55" r="9"/></g>
      ${eyes}
      <g fill="#F7A58B"><ellipse cx="72" cy="118" rx="9" ry="5.5"/><ellipse cx="128" cy="118" rx="9" ry="5.5"/></g>
      ${mouth}
    </g></svg>`;
}

/** A pet not adopted yet: flat LockedSilhouette, Toast's crust a shade darker. */
function locked(name, fill) {
  const p = PET[name], id = 'l' + (uid++);
  const crust = p.crust ? `<defs><clipPath id="${id}">${p.sil}</clipPath></defs><g clip-path="url(#${id})"><g fill="none" stroke="${fill.crust}" stroke-width="12" stroke-linejoin="round">${p.sil}</g></g>` : '';
  return `<svg viewBox="0 0 200 210"><g fill="${fill.body}">${FEET}${p.arms}${p.sil}</g>${crust}</svg>`;
}

/** The Home scene, recomposed: desk on the left, window and plant on the right, Bun on a rug in the clear middle. */
/**
 * The floorboards, as one tile that repeats from the skirting board to the bottom of Home, so the
 * scene's floor carries on under the list (in the app: drawn behind the list, scrolling with it).
 */
function floorTile(s) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="390" height="108" viewBox="0 0 390 108">
    <rect width="390" height="108" fill="${s.floor}"/>
    <rect y="52" width="390" height="2" fill="${s.floorSeam}"/><rect y="106" width="390" height="2" fill="${s.floorSeam}"/>
    <rect x="96" y="0" width="2" height="52" fill="${s.floorSeam}"/><rect x="282" y="0" width="2" height="52" fill="${s.floorSeam}"/>
    <rect x="36" y="54" width="2" height="52" fill="${s.floorSeam}"/><rect x="196" y="54" width="2" height="52" fill="${s.floorSeam}"/><rect x="350" y="54" width="2" height="52" fill="${s.floorSeam}"/>
  </svg>`;
  // Single quotes: this goes inside a style="…" attribute.
  return `${s.floor} url('data:image/svg+xml,${encodeURIComponent(svg)}') 0 236px / 390px 108px repeat-y`;
}

/** The Home scene, recomposed: desk on the left, window and plant on the right, Bun on a rug in the clear middle. */
function scene(s) {
  return `<svg class="scene" viewBox="0 0 390 340">
  <rect width="390" height="236" fill="${s.wall}"/>
  <rect y="226" width="390" height="10" fill="${s.baseboard}"/>
  <!-- wall clock, on the open wall above the pet -->
  <circle cx="195" cy="76" r="21" fill="${s.clockEdge}"/>
  <circle cx="195" cy="74" r="21" fill="${s.clock}"/>
  <circle cx="195" cy="74" r="15.5" fill="#FFFFFF"/>
  <path d="M195 74 V64.5 M195 74 L202 78" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>
  <circle cx="195" cy="74" r="2.4" fill="${INK}"/>
  <!-- window -->
  <path d="M268 200 V124 A46 46 0 0 1 360 124 V200 Z" fill="${s.frame}"/>
  <path d="M276 194 V125 A38 38 0 0 1 352 125 V194 Z" fill="${s.sky}"/>
  <rect x="311" y="86" width="6" height="110" fill="${s.frame}"/>
  <g fill="#FFFFFF"><circle cx="330" cy="129" r="7"/><circle cx="339" cy="125" r="9"/><rect x="322" y="128" width="27" height="9" rx="4.5"/></g>
  <g fill="#FFFFFF" opacity=".85"><circle cx="292" cy="150" r="5"/><circle cx="299" cy="147" r="6.5"/><rect x="286" y="150" width="20" height="7" rx="3.5"/></g>
  <rect x="260" y="192" width="108" height="10" rx="5" fill="${s.sill}"/>
  <!-- floor plant -->
  <g>
    <ellipse cx="331" cy="176" rx="10" ry="22" transform="rotate(-34 331 176)" fill="${s.leafDark}"/>
    <ellipse cx="359" cy="174" rx="10" ry="22" transform="rotate(30 359 174)" fill="${s.leafDark}"/>
    <ellipse cx="345" cy="160" rx="11" ry="27" fill="${s.leaf}"/>
    <ellipse cx="327" cy="192" rx="9" ry="18" transform="rotate(-62 327 192)" fill="${s.leaf}"/>
    <ellipse cx="364" cy="191" rx="9" ry="18" transform="rotate(60 364 191)" fill="${s.leaf}"/>
    <path d="M345 150 V196" stroke="${s.leafDark}" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M325 210 H365 L360 246 C359.6 249 357.4 251 354.4 251 H335.6 C332.6 251 330.4 249 330 246 Z" fill="${s.pot}"/>
    <rect x="320" y="202" width="50" height="12" rx="6" fill="${s.potRim}"/>
  </g>
  <!-- desk -->
  <rect x="6" y="182" width="9" height="66" rx="3" fill="${s.deskLeg}"/>
  <rect x="88" y="182" width="9" height="66" rx="3" fill="${s.deskLeg}"/>
  <rect x="-12" y="176" width="124" height="12" rx="5" fill="${s.deskEdge}"/>
  <rect x="-12" y="170" width="124" height="12" rx="5" fill="${s.desk}"/>
  <!-- laptop -->
  <rect x="34" y="122" width="58" height="43" rx="5" fill="${s.laptopEdge}"/>
  <rect x="38" y="126" width="50" height="35" rx="2.5" fill="${s.screen}"/>
  <path d="M38 152 L62 126 H74 L44 161 H38 Z" fill="#FFFFFF" opacity=".45"/>
  <rect x="26" y="163" width="74" height="8" rx="3" fill="${s.laptop}"/>
  <rect x="54" y="163" width="18" height="3" rx="1.5" fill="${s.laptopEdge}"/>
  <!-- mug -->
  <path d="M4 150 H19 V166 C19 168.2 17.2 170 15 170 H8 C5.8 170 4 168.2 4 166 Z" fill="${s.mug}"/>
  <path d="M19 154 C23.5 154 23.5 163 19 163" fill="none" stroke="${s.mug}" stroke-width="3"/>
  <path d="M8.5 145 C6.5 141 10.5 139 8.5 135 M14.5 145 C12.5 141 16.5 139 14.5 135" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
  <!-- rug under the pet -->
  <ellipse cx="195" cy="300" rx="120" ry="23" fill="${s.rugEdge}"/>
  <ellipse cx="195" cy="297" rx="120" ry="22" fill="${s.rug}"/>
  <ellipse cx="195" cy="297" rx="100" ry="15" fill="none" stroke="${s.rugStitch}" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <ellipse cx="195" cy="298" rx="60" ry="8" fill="${s.rugShadow}"/>
</svg>`;
}

// ---------- directions ----------
// Shared scene greens and laptop greys; each direction sets the room and per-tab backgrounds.
const COMMON = { leaf: '#7CBF8E', leafDark: '#5DA373', laptop: '#D3D7E1', laptopEdge: '#B4BACA', screen: '#E8F1FA', sky: '#C2E3F7' };
const D = {
  a: { name: 'Honey Loft', lede: 'Warm and closest to today: peach wall, honey-wood floor that carries on under the list, and a different warm neutral for each tab. The safest change.',
    scene: { ...COMMON, wall: '#FFDDBB', baseboard: '#F3C9A0', floor: '#F6E3C8', floorSeam: '#EFD6B5', seams: true, frame: '#EDB98A', sill: '#E3A974',
      desk: '#F0B47E', deskEdge: '#DD9A60', deskLeg: '#E3A56F', clock: '#E58B62', clockEdge: '#CC7350', mug: '#7FB8F5',
      pot: '#E58B62', potRim: '#CC7350', rug: '#F9C3AE', rugEdge: '#F0AE96', rugStitch: '#FFFFFF', rugShadow: '#EDA992' },
    contrast: { ink: '≥ 11.2:1', muted: '5.8–6.4:1', oldMuted: '4.2–4.7:1, below 4.5 on Home and Collection' },
    home: { bg: '#F6E3C8', edge: '#E9CFAA' }, collection: { bg: '#FCE6DC', edge: '#F0CDBF' }, profile: { bg: '#FFF0CC', edge: '#F2DCA9' }, settings: { bg: '#F4EDE3', edge: '#E4D8C8' } },
  b: { name: 'Garden Studio', lede: 'Fresh and calm: sage wall with white trim, birch floor; Collection is mint, Pet is sky, Settings is lilac mist. Each tab feels like its own room.',
    scene: { ...COMMON, wall: '#D8EAD9', baseboard: '#FBF7F0', floor: '#F3EADC', floorSeam: '#EADDC9', seams: true, frame: '#FFFFFF', sill: '#F1ECE3',
      desk: '#ECC797', deskEdge: '#D8AC77', deskLeg: '#DDB07B', clock: '#7FB8F5', clockEdge: '#5E9FE6', mug: '#F68A6B',
      pot: '#E58B62', potRim: '#CC7350', rug: '#CFE3FB', rugEdge: '#B4D1F3', rugStitch: '#FFFFFF', rugShadow: '#B3CDEC' },
    contrast: { ink: '≥ 11.7:1', muted: '6.0–6.2:1', oldMuted: '4.4–4.5:1, just below 4.5 on every tab' },
    home: { bg: '#F3EADC', edge: '#E3D5C0' }, collection: { bg: '#DDF1E6', edge: '#BFE0CE' }, profile: { bg: '#E2EEFB', edge: '#C7DAF1' }, settings: { bg: '#ECE9F7', edge: '#D6D1EC' } },
  c: { name: 'Bold Playroom', lede: 'More colour, more pop: periwinkle wall, caramel floor, a coral rug; Collection is teal-mint, Pet is butter, Settings is periwinkle. White cards stand out the most.',
    scene: { ...COMMON, wall: '#C8D1F3', baseboard: '#FFFFFF', floor: '#EFCB9C', floorSeam: '#E5BD88', seams: true, frame: '#FFFFFF', sill: '#EEF0FA',
      desk: '#FFF8EF', deskEdge: '#E6D8C6', deskLeg: '#E9DCCB', clock: '#FFC857', clockEdge: '#E9A93A', mug: '#F68A6B',
      pot: '#FFC857', potRim: '#E9A93A', rug: '#F59C82', rugEdge: '#E5826A', rugStitch: '#FFE3D8', rugShadow: '#E0806A' },
    contrast: { ink: '≥ 9.1:1', muted: '4.7–5.6:1', oldMuted: '3.5–4.1:1, below 4.5 on every tab' },
    home: { bg: '#EFCB9C', edge: '#DCB27F' }, collection: { bg: '#BFE6D5', edge: '#9DD1BB' }, profile: { bg: '#FBE19B', edge: '#E9C76E' }, settings: { bg: '#D3DAF6', edge: '#B7C1EA' } },
};

// ---------- screens ----------
const TABS = [
  ['Home', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z"/></svg>'],
  ['Collection', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>'],
  ['Bun', '<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5 C17 5 20 8.5 20 13 C20 17 17 19.5 12 19.5 C7 19.5 4 17 4 13 C4 8.5 7 5 12 5 Z" fill="#7FB8F5"/><circle cx="9.5" cy="12" r="1.3" fill="#2B2A3A"/><circle cx="14.5" cy="12" r="1.3" fill="#2B2A3A"/></svg>'],
  ['Settings', '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="C" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3 V5 M12 19 V21 M3 12 H5 M19 12 H21 M5.6 5.6 L7 7 M17 17 L18.4 18.4 M5.6 18.4 L7 17 M17 7 L18.4 5.6"/></svg>'],
];
const tabbar = active => `<nav class="tabbar">${TABS.map(([l, svg], i) =>
  `<div class="tab ${i === active ? 'on' : ''}"><span>${svg.replace('stroke="C"', `stroke="${i === active ? '#E5603A' : '#6B6A7B'}"`)}</span>${l}</div>`).join('')}</nav>`;

const BREAKS = [
  ['Stand up', '1 min', 5, 'break_stand_up', '#FFE3A3', true],
  ['2-min walk', '2 min', 10, 'break_walk', '#CDEFE0', false],
  ['Neck stretch', '2 min', 5, 'break_neck', '#CFE3FB', true],
  ['Shoulder rolls', '1 min', 5, 'break_shoulders', '#CFE3FB', false],
  ['Wrist stretch', '1 min', 5, 'break_wrist', '#FDDCD2', false],
];
const edge = (px, c) => `box-shadow: 0 ${px}px 0 ${c}`;

function home(d) {
  const t = d.home;
  const cards = BREAKS.map(([title, sub, reward, icon, tint, done]) => `
    <div class="chunky brk" style="${edge(3, t.edge)}">
      <div class="tile" style="background:${tint}"><img src="icons/${icon}.svg" alt=""></div>
      <div class="txt"><b>${title}</b><span>${sub}</span></div>
      <span class="reward">+${reward}${SPARK}</span>
      <div class="check" style="${done ? 'background:#3BAA6E;box-shadow:0 4px 0 #2C8655' : 'background:#fff;border:2px solid #E8E0D5;box-shadow:0 4px 0 #DDD3C6'}">${CHECK(done ? '#FFFFFF' : '#B5ADA3')}</div>
    </div>`).join('');
  return `<div class="phone"><div class="screen" style="background:${floorTile(d.scene)}">
    ${scene(d.scene)}
    <div class="pet">${bun(0.41, 'tired')}</div>
    <div class="pill-btn menu" style="${edge(4, '#E8DCCD')}">${MENU}</div>
    <div class="pill-btn sparks" style="${edge(4, '#E8DCCD')}"><span class="spark">${SPARK}</span>120</div>
    <div class="chunky timer" style="${edge(4, t.edge)}">
      <small>Time since last break</small>
      <div class="row"><span class="min">32 min</span><span class="chip" style="background:#FFF0CC">Bun is getting tired</span></div>
      <div class="bar"><i style="width:71%;background:#F2A93B"></i></div>
    </div>
    <div class="list">
      <div class="list-head"><h2 class="h-section">Breaks for today</h2><span style="color:var(--muted)">2 of 7 done</span></div>
      <div class="cards">${cards}</div>
    </div>
  </div>${tabbar(0)}</div>`;
}

function collection(d) {
  const t = d.collection;
  const lockFill = { body: '#DCD5CB', crust: '#D0C7BA' };
  const price = n => `<span class="ppill" style="background:#FFF0CC">${SPARK}${n}</span>`;
  const card = (svg, name, pill, active) =>
    `<div class="chunky pcard ${active ? 'active' : ''}" style="${edge(4, t.edge)}">${svg}<b>${name}</b>${pill}</div>`;
  return `<div class="phone"><div class="screen" style="background:${t.bg}">
    <div class="col-head"><h1 class="h-title">Collection</h1><div class="pill-btn sparks" style="${edge(4, t.edge)}"><span class="spark">${SPARK}</span>100</div></div>
    <p class="col-sub" style="color:var(--muted)">Earn sparks from breaks to adopt new friends.</p>
    <div class="seg" style="background:${t.edge}"><div class="on">Pets</div><div style="color:${INK}">Accessories</div></div>
    <div class="grid">
      ${card(bun(1, 'happy'), 'Bun', '<span class="ppill" style="background:#DDF3E9;color:#2B7A57">With you</span>', true)}
      ${card(locked('pip', lockFill), 'Pip', price(75))}
      ${card(locked('toast', lockFill), 'Toast', price(150))}
      ${card(locked('nimbus', lockFill), 'Nimbus', price(300))}
    </div>
  </div>${tabbar(1)}</div>`;
}

function settings(d) {
  const t = d.settings;
  const row = (icon, tint, title, sub, right, cls = '') => `<div class="srow ${cls}">
      <div class="stile" style="background:${tint}"><img src="icons/${icon}.svg" alt=""></div>
      <div class="st"><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</div>${right}</div>`;
  const status = (txt, on) => `<span class="status" style="${on ? 'background:#DDF3E9;color:#2B7A57' : 'background:#F1EBE3;color:#56556A'}">${txt}</span>`;
  const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((l, i) =>
    `<div class="day" style="${i < 5 ? `background:${INK};color:#fff` : 'background:#F1EBE3;color:#56556A'}">${l}</div>`).join('');
  const group = inner => `<div class="chunky group" style="${edge(4, t.edge)}">${inner}</div>`;
  return `<div class="phone"><div class="screen" style="background:${t.bg}"><div class="set">
    <h1 class="h-title">Settings</h1>
    ${group(
      row('settings_bell', '#FFE3A3', 'Notifications', 'So your pet can remind you', status('On', true)) +
      row('break_walk', '#CDEFE0', 'Movement detection', 'Turned off in your phone’s settings', status('Off', false)) +
      row('settings_widget', '#CFE3FB', 'Widget', 'See your pet from your home screen', status('Added', true)))}
    <h2 class="h-section">Work hours</h2>
    ${group(`<div class="days">${days}</div>`
      + row('settings_sunrise', '#FFE3A3', 'Starts', '', '<span class="value">9 AM</span>', 'full-line')
      + row('settings_moon', '#E6DDFB', 'Ends', '', '<span class="value">6 PM</span>'))}
    <h2 class="h-section">Breaks</h2>
    ${group(
      row('settings_timer', '#FDDCD2', 'Remind me every', '', '<span class="value">45 min</span>') +
      `<div class="hint full-line" style="color:#6B6A7B">Choose which breaks show on Home.</div>` +
      row('break_stand_up', '#FFE3A3', 'Stand up', '', '<div class="toggle"></div>') +
      row('break_walk', '#CDEFE0', '2-min walk', '', '<div class="toggle"></div>') +
      row('break_neck', '#CFE3FB', 'Neck stretch', '', '<div class="toggle"></div>'))}
  </div></div>${tabbar(3)}</div>`;
}

// ---------- boards ----------
function board(key) {
  const d = D[key];
  const sw = (label, hex) => `<div class="sw"><i style="background:${hex}"></i><b>${label}</b>${hex}</div>`;
  return `<div class="board">
    <div class="board-head">
      <div><div class="tag">Direction ${key.toUpperCase()}</div><h1>${d.name}</h1><p class="lede">${d.lede}</p></div>
      <div class="swatches">${sw('Home wall', d.scene.wall)}${sw('Home floor', d.home.bg)}${sw('Collection', d.collection.bg)}${sw('Pet tab', d.profile.bg)}${sw('Settings', d.settings.bg)}${sw('Rug', d.scene.rug)}</div>
    </div>
    <div class="phones">
      <div class="phone-wrap">${home(d)}<div class="phone-label">Home</div></div>
      <div class="phone-wrap">${collection(d)}<div class="phone-label">Collection</div></div>
      <div class="phone-wrap">${settings(d)}<div class="phone-label">Settings</div></div>
    </div>
    <div class="board-foot">
      <div><b>Same in every direction:</b> white cards with a chunky edge tinted from the background they sit on; the new filled break icons; Settings grouped into one card per section with dividers; the desk moved left so Bun stands clear of it, on a rug.</div>
      <div><b>Contrast (WCAG AA):</b> Ink on every tab background ${d.contrast.ink}. Secondary text that sits on the backgrounds needs a darker muted, <b>#56556A</b> (${d.contrast.muted}); today's #6B6A7B would be ${d.contrast.oldMuted}. Text on white cards is unchanged (#6B6A7B, 5.3:1).</div>
    </div>
  </div>`;
}

function iconBoard() {
  const icons = [
    ['break_stand_up', '#FFE3A3', 'Stand up'], ['break_walk', '#CDEFE0', '2-min walk'], ['break_neck', '#CFE3FB', 'Neck stretch'],
    ['break_shoulders', '#CFE3FB', 'Shoulder rolls'], ['break_wrist', '#FDDCD2', 'Wrist stretch'], ['break_eyes', '#E6DDFB', 'Eyes rest'],
    ['break_water', '#FCE1EC', 'Drink water'],
  ];
  const set = [
    ['settings_bell', '#FFE3A3', 'Notifications'], ['break_walk', '#CDEFE0', 'Movement'], ['settings_widget', '#CFE3FB', 'Widget'],
    ['settings_sunrise', '#FFE3A3', 'Starts'], ['settings_moon', '#E6DDFB', 'Ends'], ['settings_timer', '#FDDCD2', 'Remind me every'],
    ['settings_shield', '#CDEFE0', 'Privacy policy'],
  ];
  const cell = ([f, tint, label]) => `<div class="icon-cell"><div class="big" style="background:${tint}"><img src="icons/${f}.svg" alt=""></div>
      <div class="small"><div class="tile" style="background:${tint}"><img src="icons/${f}.svg" alt=""></div></div>${label}</div>`;
  return `<div class="icons-board">
    <div class="tag">Same in all three directions</div><h1 class="h-title" style="font-size:40px;margin:2px 0 6px">Break and Settings icons</h1>
    <p class="lede" style="font-weight:600;font-size:17px;color:#4F4E62;max-width:900px;margin:0">Our own SVG art, 48-unit grid. Each shape is filled in the break colour and sits on a 2-unit chunky edge in a darker shade, like our cards and buttons; Ink for faces and arrows; one soft white highlight. Shown large and at the real 48 dp tile size.</p>
    <div class="icon-row">${icons.map(cell).join('')}</div>
    <div class="icon-row">${set.map(cell).join('')}</div>
  </div>`;
}

const key = new URLSearchParams(location.search).get('d') || 'a';
document.getElementById('root').innerHTML = key === 'icons' ? iconBoard() : board(key);
</script>
</body>
</html>
