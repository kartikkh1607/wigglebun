</helmet>

<svg width="390" height="240" viewBox="0 0 390 240" style="position: absolute; left: 0; top: 0" aria-hidden="true">

  <circle cx="195" cy="168" r="80" fill="#EAF3FD"/>
  <g fill="#FFFFFF"><path d="M74 96 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/><path d="M318 118 l2.6 6 6 2.6 -6 2.6 -2.6 6 -2.6 -6 -6 -2.6 6 -2.6 z"/><circle cx="104" cy="160" r="3"/><circle cx="292" cy="78" r="3.4"/></g>
  <path d="M300 58 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 z" fill="#FFC857"/>

<div style="position: absolute; left: 118px; top: 74px; width: 154px; height: 162px">
<svg viewBox="0 0 200 210" width="154" height="162" aria-hidden="true">
  <g fill="#F5DC8B"><ellipse cx="40" cy="70" rx="10" ry="21" transform="rotate(-28 40 70)"/><ellipse cx="160" cy="70" rx="10" ry="21" transform="rotate(28 160 70)"/><path d="M100 46 C130 46 144 62 149 86 C153 106 166 124 166 148 C166 174 140 190 100 190 C60 190 34 174 34 148 C34 124 47 106 51 86 C56 62 70 46 100 46 Z"/><circle cx="62" cy="54" r="18"/><circle cx="138" cy="54" r="18"/></g>
  <g fill="#F6A98A"><circle cx="62" cy="55" r="9"/><circle cx="138" cy="55" r="9"/></g>
  <g fill="#2B2A3A"><circle cx="84" cy="106" r="6"/><circle cx="116" cy="106" r="6"/><circle cx="86" cy="104" r="2" fill="#FFFFFF"/><circle cx="118" cy="104" r="2" fill="#FFFFFF"/></g>
  <g fill="#F7A58B"><ellipse cx="72" cy="118" rx="9" ry="5.5"/><ellipse cx="128" cy="118" rx="9" ry="5.5"/></g>
  <path d="M93 112 Q100 124 107 112 Z" fill="#2B2A3A" stroke="#2B2A3A" stroke-width="3" stroke-linejoin="round"/>
</svg>
</div>

<a href="Locked.dc.html" aria-label="Close" style="position: absolute; left: 16px; top: 16px; width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56556A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
</a>
<button style="position: absolute; right: 16px; top: 22px; border: 0; background: transparent; font-family: Nunito, sans-serif; font-weight: 800; font-size: 14px; color: #3C3B52; padding: 6px 4px">Restore</button>

<div style="position: absolute; left: 0; right: 0; top: 212px; bottom: 0; background: #FFFFFF; border-radius: 32px 32px 0 0; box-shadow: 0 -3px 0 #C7DAF1; padding: 22px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
  <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 27px; line-height: 1.12; text-align: center">Keep Bun moving with you</h1>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 11px; background: #FFF0CC; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="0 0 200 210" width="24" height="25" aria-hidden="true"><g fill="#F5DC8B"><path d="M100 46 C130 46 144 62 149 86 C153 106 166 124 166 148 C166 174 140 190 100 190 C60 190 34 174 34 148 C34 124 47 106 51 86 C56 62 70 46 100 46 Z"/><circle cx="62" cy="54" r="18"/><circle cx="138" cy="54" r="18"/></g><rect x="30" y="36" width="140" height="70" fill="#E9E5DE"/><g fill="#2B2A3A"><circle cx="84" cy="116" r="9"/><circle cx="116" cy="116" r="9"/></g></svg></span>
      <span style="font-weight: 700; font-size: 15px; line-height: 1.3">Your pet gets tired as you sit and perks up when you move</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 11px; background: #CFE3FB; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="icons/break_neck.svg" alt="" style="width: 26px; height: 26px"></span>
      <span style="font-weight: 700; font-size: 15px; line-height: 1.3">Gentle nudges and 1–2 minute guided stretches</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 34px; height: 34px; border-radius: 11px; background: #DDF3E9; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z" fill="#FFC857" stroke="#E5A52A" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
      <span style="font-weight: 700; font-size: 15px; line-height: 1.3">Earn sparks for breaks to adopt new pets and accessories</span>
    </div>
  </div>

  <sc-if value="{{ isYearly }}" hint-placeholder-val="{{ true }}">
    <div style="background: #F8F4EE; border-radius: 18px; padding: 12px 10px 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative">
      <div style="position: absolute; left: 16.6%; right: 16.6%; top: 20px; height: 3px; background: #E3DCD2"></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; text-align: center"><span style="width: 18px; height: 18px; border-radius: 50%; background: #3BAA6E; box-shadow: 0 0 0 4px #F8F4EE"></span><b style="font-weight: 800; font-size: 13px">Today</b><span style="font-weight: 600; font-size: 12px; color: #56556A">Full access</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; text-align: center"><span style="width: 18px; height: 18px; border-radius: 50%; background: #FFC857; box-shadow: 0 0 0 4px #F8F4EE"></span><b style="font-weight: 800; font-size: 13px">Day 6</b><span style="font-weight: 600; font-size: 12px; color: #56556A">We remind you</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; text-align: center"><span style="width: 18px; height: 18px; border-radius: 50%; background: #2B2A3A; box-shadow: 0 0 0 4px #F8F4EE"></span><b style="font-weight: 800; font-size: 13px">Day 8</b><span style="font-weight: 600; font-size: 12px; color: #56556A">First charge</span></div>
    </div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
    <sc-for list="{{ plans }}" as="p" hint-placeholder-count="3">
      <button onClick="{{ p.pick }}" aria-pressed="{{ p.selected }}" style="{{ p.cardStyle }}">
        <sc-if value="{{ p.badge }}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; left: 50%; top: -11px; transform: translateX(-50%); white-space: nowrap; background: #3BAA6E; color: #FFFFFF; font-weight: 800; font-size: 11px; padding: 3px 9px; border-radius: 999px">{{ p.badge }}</span>
        </sc-if>
        <span style="font-weight: 800; font-size: 14px">{{ p.label }}</span>
        <span style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 21px; line-height: 1.1">{{ p.price }}</span>
        <span style="font-weight: 700; font-size: 12px; color: #56556A">{{ p.sub }}</span>
      </button>
    </sc-for>
  </div>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; align-items: center">
  <button style="width: 100%; height: 58px; border: 0; border-radius: 20px; background: #2B2A3A; box-shadow: 0 5px 0 #14131F; color: #FFFFFF; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 19px">{{ cta }}</button>
  <p style="margin: 2px 0 0; font-weight: 600; font-size: 12.5px; line-height: 1.45; color: #56556A; text-align: center">{{ finePrint }}</p>
  <div style="display: flex; gap: 18px; font-weight: 800; font-size: 13px"><a href="#terms">Terms</a><a href="#privacy">Privacy</a></div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"plan":{"editor":"enum","options":["yearly","monthly","lifetime"],"default":"yearly"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: null };
  }
  renderVals() {
    const plan = this.state.plan || this.props.plan || 'yearly';
    const base = 'position: relative; height: 104px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: Nunito, sans-serif; color: #2B2A3A; padding: 8px 4px; box-sizing: border-box; ';
    const on = 'background: #FFF8E6; border: 3px solid #2B2A3A; box-shadow: 0 4px 0 #2B2A3A;';
    const off = 'background: #FFFFFF; border: 2px solid #E8E0D5; box-shadow: 0 4px 0 #E8E0D5;';
    const defs = [
      { id: 'yearly', label: 'Yearly', price: '$29.99', sub: '$2.50 / month', badge: '7 days free' },
      { id: 'monthly', label: 'Monthly', price: '$4.99', sub: 'per month', badge: '' },
      { id: 'lifetime', label: 'Lifetime', price: '$59.99', sub: 'pay once', badge: '' },
    ];
    const plans = defs.map((d) => ({
      ...d,
      selected: d.id === plan,
      cardStyle: base + (d.id === plan ? on : off),
      pick: () => this.setState({ plan: d.id }),
    }));
    const copy = {
      yearly: ['Start 7-day free trial', '7 days free, then $29.99 a year. We remind you 2 days before it ends. Cancel anytime in Google Play › Subscriptions.'],
      monthly: ['Continue with monthly', '$4.99 a month, starting today. Cancel anytime in Google Play › Subscriptions.'],
      lifetime: ['Get lifetime access', '$59.99 once. No subscription, nothing to cancel.'],
    }[plan];
    return { plans, isYearly: plan === 'yearly', cta: copy[0], finePrint: copy[1] };
  }
}
</script>
</body>
</html>
