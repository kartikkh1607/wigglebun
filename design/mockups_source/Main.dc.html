<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2B2A3A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF4E8; font-family: Nunito, system-ui, sans-serif; color: #2B2A3A; display: flex; flex-direction: column">
<div style="position: relative; width: 390px; height: 340px; flex-shrink: 0">
<img src="/_blob/ee3d9f20fc8e3aa842413fd90a72048e" alt="" style="position: absolute; left: 0; top: 0; width: 390px; height: 340px; object-fit: cover; display: block">
<div style="position: absolute; left: 135px; top: 284px; width: 120px; height: 16px; border-radius: 50%; background: #E6D9C8"></div>
<div style="position: absolute; left: 100px; top: 116px; width: 190px; height: 190px">
<dc-import name="Pet" mood="{{petMood}}" size="{{ 190 }}" hint-size="190px,190px"></dc-import>
</div>
<button aria-label="Open menu" style="position: absolute; left: 16px; top: 16px; width: 48px; height: 48px; border-radius: 16px; border: none; background: #FFFFFF; box-shadow: 0 4px 0 #E8DCCD; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2A3A" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
</button>
<div style="position: absolute; right: 16px; top: 20px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 0 #E8DCCD; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z" fill="#FFC857" stroke="#E5A52A" stroke-width="1.5" stroke-linejoin="round"></path></svg>
<span>120</span>
</div>
</div>
<div style="margin: -36px 16px 0; position: relative; background: #FFFFFF; border-radius: 24px; padding: 16px 18px; box-shadow: 0 4px 0 #EFE3D4; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 700; color: #6B6A7B">Time since last break</span>
<span style="font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 32px; line-height: 1.1">{{minutes}} min</span>
</div>
<span style="font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 999px; background: {{chipBg}}; color: #2B2A3A">{{chip}}</span>
</div>
<div style="height: 10px; border-radius: 999px; background: #F1EBE3; overflow: hidden">
<div style="height: 10px; width: {{pct}}%; border-radius: 999px; background: {{barColor}}"></div>
</div>
<sc-if value="{{showCta}}" hint-placeholder-val="{{ false }}">
<button style="margin-top: 4px; height: 52px; border: none; border-radius: 999px; background: #2B2A3A; box-shadow: 0 4px 0 #14131F; color: #FFFFFF; font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">Take a 2-min break</button>
</sc-if>
</div>
<div style="padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: baseline">
<h2 style="margin: 0; font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 22px">Breaks for today</h2>
<span style="font-size: 14px; font-weight: 700; color: #6B6A7B">2 of 6 done</span>
</div>
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{breaks}}" as="b" hint-placeholder-count="3">
<div style="background: #FFFFFF; border-radius: 24px; padding: 12px 12px 12px 14px; box-shadow: 0 3px 0 #EFE3D4; display: flex; align-items: center; gap: 12px">
<div style="width: 48px; height: 48px; border-radius: 16px; background: {{b.color}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2B2A3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-weight: 800; font-size: 17px">{{b.title}}</span>
<span style="font-size: 14px; font-weight: 600; color: #6B6A7B">{{b.sub}}</span>
</div>
<span style="display: flex; align-items: center; gap: 3px; font-weight: 800; font-size: 15px">+{{b.reward}}<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z" fill="#FFC857" stroke="#E5A52A" stroke-width="1.5" stroke-linejoin="round"></path></svg></span>
<button aria-label="{{b.aria}}" style="width: 52px; height: 48px; border-radius: 16px; border: 2px solid {{b.btnBorder}}; background: {{b.btnBg}}; box-shadow: 0 4px 0 {{b.btnEdge}}; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{b.checkColor}}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7"></path></svg>
</button>
</div>
</sc-for>
</div>
<nav aria-label="Main" style="margin-top: auto; height: 84px; background: #FFFFFF; border-top: 2px solid #F3E9DD; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 14px; box-sizing: border-box">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #2B2A3A; font-weight: 800; font-size: 12px">
<span style="width: 56px; height: 34px; border-radius: 999px; background: #FDE6CF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5603A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z"></path></svg></span>Home</a>
<a href="Collection.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6A7B; font-weight: 700; font-size: 12px">
<span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A7B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg></span>Collection</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6A7B; font-weight: 700; font-size: 12px">
<span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5 C17 5 20 8.5 20 13 C20 17 17 19.5 12 19.5 C7 19.5 4 17 4 13 C4 8.5 7 5 12 5 Z" fill="#7FB8F5"></path><circle cx="9.5" cy="12" r="1.3" fill="#2B2A3A"></circle><circle cx="14.5" cy="12" r="1.3" fill="#2B2A3A"></circle></svg></span>Bun</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6A7B; font-weight: 700; font-size: 12px">
<span style="width: 56px; height: 34px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A7B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3 V5 M12 19 V21 M3 12 H5 M19 12 H21 M5.6 5.6 L7 7 M17 17 L18.4 18.4 M5.6 18.4 L7 17 M17 7 L18.4 5.6"></path></svg></span>Settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["happy","tired","stiff"],"default":"tired"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var mood = this.props.mood ?? 'tired';
    var S = {
      happy: { minutes: 12, pct: 27, chip: 'Bun feels great', chipBg: '#DDF3E9', bar: '#4DB88A', cta: false },
      tired: { minutes: 32, pct: 71, chip: 'Bun is getting tired', chipBg: '#FFF0CC', bar: '#F2A93B', cta: false },
      stiff: { minutes: 52, pct: 100, chip: 'Bun is stiff', chipBg: '#FDDCD2', bar: '#E5603A', cta: true }
    };
    var s = S[mood] || S.tired;
    function row(title, sub, reward, color, icon, done) {
      return {
        title: title, sub: sub, reward: reward, color: color, icon: icon,
        aria: done ? title + ', done' : 'Mark ' + title + ' as done',
        btnBg: done ? '#3BAA6E' : '#FFFFFF',
        btnBorder: done ? '#3BAA6E' : '#E8E0D5',
        btnEdge: done ? '#2C8655' : '#DDD3C6',
        checkColor: done ? '#FFFFFF' : '#B5ADA3'
      };
    }
    return {
      petMood: mood,
      minutes: s.minutes,
      pct: s.pct,
      chip: s.chip,
      chipBg: s.chipBg,
      barColor: s.bar,
      showCta: s.cta,
      breaks: [
        row('Stand up', '1 min', 5, '#FFE3A3', 'M12 21 V10 M8 13 L12 9 L16 13 M12 6 a2 2 0 1 0 0.01 0', true),
        row('Neck stretch', '2 min', 5, '#CFE3FB', 'M12 7 a3 3 0 1 0 0.01 0 M6 20 C6 15 9 12.5 12 12.5 C15 12.5 18 15 18 20 M17 5 L19.5 7.5 L17 10', true),
        row('2-min walk', '2 min', 10, '#CDEFE0', 'M13 4 a1.8 1.8 0 1 0 0.01 0 M9 21 L11 15 L14 17 L15 21 M11 15 L12 9 L16 11 L18 10 M12 9 L8 11 L7 14', false)
      ]
    };
  }
}
</script>
</body>
</html>
