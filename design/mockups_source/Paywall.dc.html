<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paywall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4A4458}a:hover{color:#2B2A3A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF4E8; font-family: Nunito, system-ui, sans-serif; color: #2B2A3A; display: flex; flex-direction: column; align-items: center">
<div style="width: 100%; display: flex; justify-content: space-between; padding: 14px 16px 0; box-sizing: border-box">
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6A7B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg>
</a>
<a href="#" style="font-weight: 800; font-size: 14px; text-decoration: none; padding: 12px 4px">Restore</a>
</div>
<div style="margin-top: -6px; width: 150px; height: 150px">
<dc-import name="Pet" mood="celebrate" size="{{ 150 }}" hint-size="150px,150px"></dc-import>
</div>
<h1 style="margin: 4px 0 0; font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 28px; text-align: center; line-height: 1.15; padding: 0 28px">Bun is ready to move<br>with you every day</h1>
<div style="margin-top: 14px; width: 100%; padding: 0 30px; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px">
<sc-for list="{{benefits}}" as="it" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span style="width: 24px; height: 24px; border-radius: 8px; background: #3BAA6E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7"></path></svg></span>
<span style="font-size: 16px; font-weight: 700; line-height: 1.35">{{it}}</span>
</div>
</sc-for>
</div>
<div style="margin-top: 18px; width: 100%; padding: 0 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px" role="radiogroup" aria-label="Choose a plan">
<label style="position: relative; background: #FFFFFF; border: 3px solid #2B2A3A; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="radio" name="plan" checked style="width: 20px; height: 20px; accent-color: #2B2A3A; margin: 0">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 17px">Yearly</span>
<span style="font-size: 14px; font-weight: 700; color: #6B6A7B">14 days free, then [YEARLY PRICE]/year</span>
</span>
<span style="position: absolute; right: 14px; top: -12px; background: #FFC857; color: #2B2A3A; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px">Best value</span>
</label>
<label style="background: #FFFFFF; border: 2px solid #E8E0D5; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="radio" name="plan" style="width: 20px; height: 20px; accent-color: #2B2A3A; margin: 0">
<span style="flex: 1; font-weight: 800; font-size: 17px">Monthly</span>
<span style="font-size: 15px; font-weight: 700; color: #6B6A7B">[MONTHLY PRICE]/mo</span>
</label>
<label style="background: #FFFFFF; border: 2px solid #E8E0D5; border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="radio" name="plan" style="width: 20px; height: 20px; accent-color: #2B2A3A; margin: 0">
<span style="flex: 1; font-weight: 800; font-size: 17px">Lifetime</span>
<span style="font-size: 15px; font-weight: 700; color: #6B6A7B">[LIFETIME PRICE] once</span>
</label>
</div>
<button style="margin-top: 18px; width: 358px; height: 58px; border-radius: 999px; border: none; background: #2B2A3A; box-shadow: 0 5px 0 #14131F; color: #FFFFFF; font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 19px; cursor: pointer">Start 14-day free trial</button>
<p style="margin: 12px 0 0; padding: 0 28px; text-align: center; font-size: 13px; font-weight: 600; color: #6B6A7B; line-height: 1.45">Cancel anytime in Google Play › Subscriptions. We’ll remind you 2 days before your trial ends.</p>
<div style="margin-top: 8px; display: flex; gap: 18px; font-size: 13px; font-weight: 700">
<a href="#">Terms</a>
<a href="#">Privacy</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      benefits: [
        'Gentle nudges that snooze around your meetings',
        'Walking resets the timer on its own, no logging',
        'Adopt every pet and build your own breaks'
      ]
    };
  }
}
</script>
</body>
</html>
