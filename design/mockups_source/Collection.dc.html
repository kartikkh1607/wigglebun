<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFF4E8; font-family: Nunito, system-ui, sans-serif; color: #2B2A3A; display: flex; flex-direction: column">
<div style="padding: 22px 20px 4px; display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 30px">Collection</h1>
<div style="height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 4px 0 #E8DCCD; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z" fill="#FFC857" stroke="#E5A52A" stroke-width="1.5" stroke-linejoin="round"></path></svg>
<span>120</span>
</div>
</div>
<p style="margin: 0; padding: 0 20px 16px; font-size: 15px; font-weight: 700; color: #6B6A7B">Earn sparks from breaks to adopt new friends.</p>
<div style="padding: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 3px solid #2B2A3A; border-radius: 24px; padding: 10px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 112px; height: 112px">
<dc-import name="Pet" mood="happy" size="{{ 112 }}" hint-size="112px,112px"></dc-import>
</div>
<span style="font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 19px">Bun</span>
<span style="font-size: 13px; font-weight: 800; background: #DDF3E9; color: #2B7A57; padding: 4px 12px; border-radius: 999px">With you</span>
</div>
<sc-for list="{{locked}}" as="p" hint-placeholder-count="5">
<button aria-label="{{p.aria}}" style="background: #FFFFFF; border: none; border-radius: 24px; padding: 10px 10px 14px; box-shadow: 0 4px 0 #EFE3D4; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: Nunito, system-ui, sans-serif; color: #2B2A3A; cursor: pointer">
<svg width="112" height="112" viewBox="0 0 100 100" aria-hidden="true"><path d="{{p.shape}}" fill="#DCD5CB"></path></svg>
<span style="font-family: Fredoka, system-ui, sans-serif; font-weight: 600; font-size: 19px">{{p.name}}</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; background: {{p.pillBg}}; padding: 4px 12px; border-radius: 999px">
<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="{{p.pillIcon}}" fill="{{p.pillIconFill}}" stroke="#2B2A3A" stroke-width="1.2" stroke-linejoin="round"></path></svg>{{p.price}}</span>
</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var star = 'M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z';
    var lock = 'M7 11 V8 a5 5 0 0 1 10 0 V11 H19 V21 H5 V11 Z';
    function pet(name, shape, price, premium) {
      return {
        name: name, shape: shape,
        price: premium ? 'Premium' : String(price),
        aria: premium ? name + ', included with Premium' : name + ', adopt for ' + price + ' sparks',
        pillBg: premium ? '#EDE6FC' : '#FFF0CC',
        pillIcon: premium ? lock : star,
        pillIconFill: premium ? '#B9A3F0' : '#FFC857'
      };
    }
    return {
      locked: [
        pet('Pip', 'M50 36 C62 36 68 46 70 58 C80 66 84 76 84 82 C84 91 70 94 50 94 C30 94 16 91 16 82 C16 76 20 66 30 58 C32 46 38 36 50 36 Z M40 42 C30 32 28 8 36 6 C44 4 48 24 46 38 Z M60 42 C70 32 72 8 64 6 C56 4 52 24 54 38 Z M38 92 C36 98 44 99 44 93 Z M56 93 C56 99 64 98 62 92 Z', 150, false),
        pet('Toast', 'M22 42 C14 40 14 22 34 18 C42 16 58 16 66 18 C86 22 86 40 78 42 V84 C78 88 76 90 72 90 H28 C24 90 22 88 22 84 Z', 200, false),
        pet('Nimbus', 'M26 80 C14 80 10 70 14 62 C18 54 26 52 30 54 C32 40 44 32 56 34 C68 36 74 46 74 52 C84 50 92 58 90 68 C88 76 82 80 76 80 Z', 300, false),
        pet('Pebble', 'M50 40 C76 40 90 56 90 70 C90 84 74 90 50 90 C26 90 10 84 10 70 C10 56 24 40 50 40 Z', 400, false),
        pet('Sprout', 'M30 58 H70 L66 90 H34 Z M50 58 C50 44 50 34 50 30 M50 34 C40 20 26 22 22 28 C30 36 42 38 50 36 Z M50 32 C58 18 72 16 78 22 C72 32 60 34 50 34 Z M26 50 C26 40 74 40 74 50 C74 60 26 60 26 50 Z', 0, true)
      ]
    };
  }
}
</script>
</body>
</html>
