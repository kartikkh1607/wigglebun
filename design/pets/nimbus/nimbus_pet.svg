<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="400" height="420"><!-- Wigglebun pet "Nimbus". Same layer system as bun_pet.svg. Fill: draw #silhouette grey #E9E5DE, clip to it, draw #C9B8F2 from fillTop = 36 + (1 - energy) * 160 down, 4-unit edge #B39FE6 at fillTop. --><g id="feet" fill="#C9B8F2"><ellipse cx="80" cy="192" rx="13" ry="10"/><ellipse cx="120" cy="192" rx="13" ry="10"/></g><g id="arms_side" fill="#C9B8F2"><ellipse cx="36" cy="132" rx="10" ry="17" transform="rotate(28 36 132)"/><ellipse cx="164" cy="132" rx="10" ry="17" transform="rotate(-28 164 132)"/></g><g id="arms_up" fill="#C9B8F2" display="none"><ellipse cx="34" cy="86" rx="10" ry="19" transform="rotate(-30 34 86)"/><ellipse cx="166" cy="86" rx="10" ry="19" transform="rotate(30 166 86)"/></g><g id="silhouette" fill="#C9B8F2"><path d="M38 142 C38 110 62 98 100 98 C138 98 162 110 162 142 C162 176 140 190 100 190 C60 190 38 176 38 142 Z"/><circle cx="63" cy="104" r="26"/><circle cx="100" cy="74" r="38"/><circle cx="137" cy="104" r="26"/></g><g id="eyes" fill="#2B2A3A"><circle cx="84" cy="106" r="5.5"/><circle cx="116" cy="106" r="5.5"/></g><g id="cheeks" fill="#F7A58B"><ellipse cx="72" cy="118" rx="9" ry="5.5"/><ellipse cx="128" cy="118" rx="9" ry="5.5"/></g><path id="mouth" d="M96 112 Q100 117 104 112 Z" fill="#2B2A3A" stroke="#2B2A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>