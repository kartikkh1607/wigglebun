# Build, lint and screenshot-verify every PR and every push to main (CLAUDE.md §13).
# Reference images in app/src/test/screenshots are recorded and verified on this Linux runner only.
name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # gradle/gradle-daemon-jvm.properties asks for JDK 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches the Gradle distribution, dependencies and build cache. Only main writes the cache;
      # PRs read it, so they stay fast without filling the 10 GB limit with per-branch copies.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build, lint, unit + screenshot tests
        run: ./gradlew assembleDebug lintDebug verifyRoborazziDebug --stacktrace

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: roborazzi-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
