# Re-records the Roborazzi reference images on this Linux runner and commits them to the branch
# (CLAUDE.md §13: references are recorded on Linux only). Runs only when the pushed commit's
# message contains "[record screenshots]", and only on claude/** branches, never on main.
# The commit it pushes does not start the Android check by itself (GitHub does not run workflows
# for pushes made with GITHUB_TOKEN); the next push to the branch does.
name: Record screenshots

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

concurrency:
  group: record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    if: contains(github.event.head_commit.message, '[record screenshots]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Record reference images
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Commit the changed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --cached --quiet; then
            echo "No reference image changed."
          else
            git commit -m "Reference images from CI (Linux)"
            git push
          fi
